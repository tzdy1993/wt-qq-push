name: WT News to QQ

on:
  # 定时触发交给外部 cron-job.org 调用这个端点（每 30 分钟）：
  #   POST https://api.github.com/repos/tzdy1993/wt-qq-push/actions/workflows/push.yml/dispatches
  # GitHub 原生 schedule 极不稳定（实测 12 小时只触发 2 次，而外部定时器 24 次），
  # 已停用，避免重复排队浪费 Actions 额度。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wt-news-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Push new news
        env:
          QQ_APPID: ${{ secrets.QQ_APPID }}
          QQ_SECRET: ${{ secrets.QQ_SECRET }}
          QQ_GROUP_OPENID: ${{ secrets.QQ_GROUP_OPENID }}
        run: python main.py

      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "chore: update state.json"
            git push
          else
            echo "state.json 无变化"
          fi
